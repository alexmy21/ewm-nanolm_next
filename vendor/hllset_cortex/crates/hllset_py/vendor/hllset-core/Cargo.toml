[package]
name = "hllset-core"
version = "0.2.0"
edition = "2021"
authors = ["HLLSet Algebra Project"]
license = "MIT"
description = "Core HLLSet algebra engine: HyperLogLog with set operations, BSS morphisms, content-addressing, hashing, and serialization"

[dependencies]
murmur3 = "0.5"
sha1 = "0.10"
hex = "0.4"
roaring = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
